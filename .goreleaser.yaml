# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: harness-memory

builds:
  - id: memoryd
    main: ./cmd/memoryd
    binary: memoryd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: memory
    main: ./cmd/memory
    binary: memory
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: git

sboms:
  - artifacts: archive
