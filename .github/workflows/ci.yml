name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  MEMORY_TEST_DATABASE_URL: postgres://memory:memory@localhost:5432/memory_test?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "unformatted files:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -p 1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null ./cmd/memoryd
          go build -o /dev/null ./cmd/memory

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t harness-memory:ci .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/chart
